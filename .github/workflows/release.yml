name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          # 22.04 keeps the glibc floor low for older distros.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: mkdir dist && echo "NAME=Redbook-${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: macOS universal app
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output target/redbook target/{aarch64,x86_64}-apple-darwin/release/redbook
          scripts/bundle.sh target/redbook dist
          ditto -c -k --keepParent "dist/Redbook.app" "dist/$NAME-macos-universal.zip"
          hdiutil create -volname "Redbook" -srcfolder "dist/Redbook.app" -format UDZO "dist/$NAME-macos-universal.dmg"
          rm -rf "dist/Redbook.app"

      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          scripts/install-linux-deps.sh
          cargo build --locked --release
          mkdir "$NAME"
          cp target/release/redbook packaging/redbook.desktop assets/redbook.png "$NAME/"
          tar -czf "dist/$NAME-linux-x86_64.tar.gz" "$NAME"

      - name: Windows zip
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release
          7z a "dist/$NAME-windows-x86_64.zip" ./target/release/redbook.exe

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --pretty='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Redbook ${GITHUB_REF_NAME#v}" --notes-file notes.md
